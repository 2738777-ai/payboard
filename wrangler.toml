name = "payboard"
main = "src/worker.ts"
compatibility_date = "2025-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LIMIT"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Limiter"]

[version_metadata]
binding = "WORKER_VERSION"

[ai]
binding = "AI"

[vars]
AI_PER_VISITOR_PER_HOUR = "20"
AI_GLOBAL_PER_DAY = "1000"
# 2.5 系列只開放給舊帳號，新金鑰會回 404；寫在這裡，部署才不會把儀表板上的設定蓋掉
GEMINI_MODEL = "gemini-3.5-flash-lite"

# PR previews are isolated from production. Do not inherit production API secrets.
# No GEMINI_API_KEY or PAYPAL credentials are bound in previews by default.
[previews.vars]
AI_PER_VISITOR_PER_HOUR = "5"
AI_GLOBAL_PER_DAY = "0"

# Code accesses ROOM and LIMIT through env; preview bindings must be declared
# explicitly. Cloudflare provisions separate Durable Object storage per preview.
[[previews.durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[previews.durable_objects.bindings]]
name = "LIMIT"
class_name = "Limiter"
