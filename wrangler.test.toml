# CI/local-only Wrangler config. Deliberately omits the remote AI binding:
# flow.test.ts uses a local Gemini mock; no Cloudflare login or production secret.
name = "payboard-ci-local"
main = "src/worker.ts"
compatibility_date = "2025-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LIMIT"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Limiter"]

[version_metadata]
binding = "WORKER_VERSION"

[vars]
AI_GLOBAL_PER_DAY = "1000"
GEMINI_MODEL = "gemini-3.5-flash-lite"
